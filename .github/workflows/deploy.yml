name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail

          cd dist
          zip -qr ../site.zip .
          cd ..

          RESP=$(curl -sS -f -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@site.zip" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys")

          echo "$RESP" | jq '{id, state, ssl_url}' || echo "$RESP"
          ID=$(echo "$RESP" | jq -r .id)
          STATE=$(echo "$RESP" | jq -r .state)

          for i in $(seq 1 60); do
            if [ "$STATE" = "ready" ]; then break; fi
            if [ "$STATE" = "error" ]; then echo "deploy failed"; exit 1; fi
            sleep 3
            STATE=$(curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$ID" | jq -r .state)
            echo "state=$STATE"
          done

          if [ "$STATE" != "ready" ]; then echo "timed out waiting for deploy"; exit 1; fi
          echo "Deployed: https://silicon-note.netlify.app"
